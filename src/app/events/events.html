<h2>Event Types</h2>
 <!-- 1. Click Event -->

<button (click)="handleOnclick()" > Click Me</button>

<!-- 2. Input Event -->

<input (input)="OnTyping($event)" placeholder="Type Anything..."/>

<!-- 3. Keyup Event & Focus Events & Blur Events -->

<input (keyup)="OnKeyUp($event)" (blur)="onBlur()" (focus)="onFocus()" placeholder="Press Any key..." />

<!-- 4. Mouse Event -->
<div (mouseover)="OnMouseOver()" (mouseleave)="OnLeave()" class="hour-box">Hover Text</div>


<!-- Get value using Template Reference Variable -->

<h2>Get value using Template Reference Variable</h2>

<input #myInput placeholder="Enter Email...">

<button (click)="getEmail(myInput.value)">Get Email</button>

<p>Email: {{email}}</p>
